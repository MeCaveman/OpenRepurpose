name: Bug report
description: Report a reproducible OpenRepurpose defect without including secrets or private media.
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include OAuth tokens, client secrets, API tokens, webhook secrets, private media, or raw databases.
  - type: input
    id: version
    attributes:
      label: OpenRepurpose version or commit
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Installation
      options: [Windows portable, Linux portable, Docker/headless, Source checkout]
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and reproduction steps
      description: Redact local paths and identifiers when they are sensitive.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Safe diagnostics
      description: Include doctor output and redacted error codes, not secrets or Authorization headers.
