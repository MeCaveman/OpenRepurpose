name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_live_platform_smoke:
        description: Run read-only live platform checks with the protected maintainer environment
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress

      - name: Run unit tests
        run: pnpm test:unit

      - name: Run integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Install Playwright browser (Linux)
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright browser (Windows)
        if: runner.os == 'Windows'
        run: pnpm exec playwright install chromium

      - name: Run Playwright user journey
        run: pnpm test:e2e

  release-candidate-source:
    name: Release candidate source contracts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Migration and upgrade matrix
        run: pnpm test:release:migrations

      - name: Verify committed upgrade fixtures
        run: pnpm fixtures:upgrade && git diff --exit-code -- tests/fixtures/upgrade

      - name: Backup and restore matrix
        run: pnpm test:release:backup

      - name: CLI matrix
        run: pnpm test:release:cli

      - name: API and MCP matrix
        run: pnpm test:release:api-mcp

      - name: Mocked first-party platform contracts
        run: pnpm test:release:platform-contracts

      - name: FFmpeg and subtitle matrix
        run: pnpm test:release:media

  windows-portable-artifact:
    name: Windows portable artifact smoke
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install FFmpeg
        run: choco install ffmpeg --yes --no-progress

      - name: Build portable artifact
        shell: pwsh
        run: ./scripts/package-windows.ps1

      - name: Smoke clean-profile artifact
        shell: pwsh
        run: ./scripts/smoke-windows-artifact.ps1 -ArtifactDirectory artifacts/windows-x64

      - name: Upload portable artifact
        uses: actions/upload-artifact@0b2256b8c012f0828dc542b3febcab082c67f72b # v4.3.4
        with:
          name: openrepurpose-windows-x64
          path: artifacts/windows-x64/OpenRepurpose-windows-x64.zip
          if-no-files-found: error

  linux-portable-artifact:
    name: Linux portable artifact smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Build portable artifact
        run: node scripts/package-linux.mjs

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Smoke clean-profile artifact
        run: sh scripts/smoke-linux-artifact.sh artifacts/linux-x64

      - name: Upload portable artifact
        uses: actions/upload-artifact@0b2256b8c012f0828dc542b3febcab082c67f72b # v4.3.4
        with:
          name: openrepurpose-linux-x64
          path: artifacts/linux-x64/OpenRepurpose-linux-x64.tar.xz
          if-no-files-found: error

  docker-artifact:
    name: Docker image smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Build and smoke Docker image
        run: node scripts/smoke-docker.mjs

  live-platform-smoke:
    name: Optional maintainer live platform smoke
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_platform_smoke }}
    runs-on: ubuntu-latest
    environment: live-platform-smoke

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Run read-only live platform checks
        run: node scripts/smoke-live-platforms.mjs
        env:
          OPENREPURPOSE_LIVE_YOUTUBE_ACCESS_TOKEN: ${{ secrets.OPENREPURPOSE_LIVE_YOUTUBE_ACCESS_TOKEN }}
          OPENREPURPOSE_LIVE_TIKTOK_ACCESS_TOKEN: ${{ secrets.OPENREPURPOSE_LIVE_TIKTOK_ACCESS_TOKEN }}
          OPENREPURPOSE_LIVE_META_ACCESS_TOKEN: ${{ secrets.OPENREPURPOSE_LIVE_META_ACCESS_TOKEN }}
          OPENREPURPOSE_LIVE_TWITCH_ACCESS_TOKEN: ${{ secrets.OPENREPURPOSE_LIVE_TWITCH_ACCESS_TOKEN }}
          OPENREPURPOSE_LIVE_TWITCH_CLIENT_ID: ${{ secrets.OPENREPURPOSE_LIVE_TWITCH_CLIENT_ID }}
          OPENREPURPOSE_LIVE_KICK_ACCESS_TOKEN: ${{ secrets.OPENREPURPOSE_LIVE_KICK_ACCESS_TOKEN }}
